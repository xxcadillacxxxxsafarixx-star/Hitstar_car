<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f6e56">
<title>Hitster Scoreboard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hitster">
<style>
  :root {
    --bg: #f5f4f0;
    --card: #ffffff;
    --border: #e2e0d8;
    --border-strong: #c9c6ba;
    --text: #1a1a18;
    --text-secondary: #6b6a63;
    --text-muted: #9a988e;
    --accent: #0f6e56;
    --accent-bg: #e1f5ee;
    --spotify: #1ed760;
    --radius: 12px;
    --scorebar-height: 76px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 1.25rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    padding-bottom: calc(var(--scorebar-height) + 1.5rem);
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 1.25rem;
    text-align: center;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .label {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 4px;
  }
  .title {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 1rem;
  }
  input {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: #fff;
    font-size: 16px;
    color: var(--text);
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    height: 48px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; }
  button.spotify { background: var(--spotify); color: #061109; border-color: var(--spotify); }
  button.secondary { background: #fff; color: var(--text); }
  button.small {
    width: auto;
    height: 36px;
    font-size: 13px;
    font-weight: 500;
    padding: 0 10px;
  }
  button.small.active { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .countrow { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .countrow button {
    width: auto;
    flex: 1;
    min-width: 44px;
    height: 44px;
    background: #fff;
    color: var(--text);
  }
  .countrow button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .row span.pname { font-size: 14px; min-width: 90px; }
  .error { font-size: 13px; color: #b3261e; margin: 8px 0 0; display: none; }
  .track-panel { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .track-cover {
    width: 160px; height: 160px; border-radius: 12px;
    background: #e2e0d8; object-fit: cover; margin-bottom: 1rem;
  }
  .track-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .track-artist { font-size: 16px; color: var(--text-secondary); margin: 0 0 1rem; }
  .track-year { font-size: 48px; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 0.5rem; }
  .reveal-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
  .reveal-row:first-of-type { border-top: none; }
  .reveal-left { display: flex; flex-direction: column; }
  .reveal-left .pname { font-size: 14px; font-weight: 500; }
  .reveal-left .guess { font-size: 12px; color: var(--text-muted); }
  .points { font-size: 15px; font-weight: 600; color: var(--accent); min-width: 28px; text-align: right; }
  .bonusbtns { display: flex; gap: 6px; }
  .status-text { font-size: 13px; color: var(--text-muted); margin: 8px 0 0; min-height: 18px; }
  .scorebar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 10px 1.25rem calc(10px + env(safe-area-inset-bottom));
    display: none;
    z-index: 10;
  }
  .scorebar.visible { display: block; }
  .scorebar-inner {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    overflow-x: auto;
  }
  .scorebar-cell {
    flex: 1;
    min-width: 64px;
    background: var(--accent-bg);
    border-radius: 8px;
    padding: 6px 4px;
    text-align: center;
  }
  .scorebar-cell.leading { border: 2px solid var(--accent); }
  .scorebar-cell .sname { font-size: 11px; color: var(--text-secondary); margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scorebar-cell .sval { font-size: 17px; font-weight: 700; margin: 0; }
  select {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: #fff;
    font-size: 16px;
    color: var(--text);
  }
  .reset-corner-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    width: auto;
    height: 32px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 20px;
    background: #fff;
    color: var(--text-secondary);
    border: 1px solid var(--border-strong);
    z-index: 20;
  }
  .final-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }
  .final-row:first-of-type { border-top: none; }
  .final-row .fname { font-size: 16px; font-weight: 500; }
  .final-row .fplace { font-size: 13px; color: var(--text-muted); margin-right: 8px; }
  .final-row .fscore { font-size: 20px; font-weight: 700; color: var(--accent); }
  .final-row.winner { background: var(--accent-bg); border-radius: 8px; padding-left: 10px; padding-right: 10px; margin: 0 -10px; }
  .trophy { font-size: 40px; text-align: center; margin-bottom: 0.5rem; }
  .playback-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .playback-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .playback-btn.main {
    width: 64px;
    height: 64px;
    background: var(--spotify);
    color: #061109;
    border-color: var(--spotify);
    font-size: 24px;
  }
  .playback-status {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin: 8px 0 0;
    min-height: 16px;
  }
</style>
</head>
<body>
<button id="resetCornerBtn" class="reset-corner-btn">↺ Reset</button>
<h1>Hitster Scoreboard</h1>
<div id="app"></div>
<div id="scorebar" class="scorebar"><div id="scorebarInner" class="scorebar-inner"></div></div>

<script>
/*
  SPOTIFY EINRICHTEN:
  1. App unter https://developer.spotify.com/dashboard anlegen (falls noch nicht geschehen).
  2. Unten bei CLIENT_ID deine Client ID eintragen.
  3. Im Spotify-Dashboard unter "Redirect URIs" GENAU die URL eintragen, unter der
     diese Seite läuft (wird unten automatisch erkannt, z.B. deine GitHub-Pages-URL
     oder http://127.0.0.1:5500/).
  4. Scope: benötigt "user-read-currently-playing" -> der Track muss auf dem
     Spotify-Account laufen, mit dem sich die App verbindet (Wiedergabe läuft
     normal über die Spotify-App weiter, diese Seite liest nur mit).
*/
const CLIENT_ID = "e88942d7c4cb4499a9610cccd8ed4d25";
function computeRedirectUri() {
  let path = window.location.pathname;
  if (path.endsWith('index.html')) path = path.slice(0, -'index.html'.length);
  return window.location.origin + path;
}
const REDIRECT_URI = computeRedirectUri();
const SCOPES = ["user-read-currently-playing", "user-modify-playback-state"];
const STORAGE_KEY = "hitster_game_state_v1";

let state = loadState() || {
  phase: 'setup',
  gameMode: 'simultaneous',
  playerCount: 3,
  players: ['', '', ''],
  scores: [0,0,0],
  totalRounds: 10,
  round: 1,
  turnIndexInRound: 0,
  guesses: ['', '', ''],
  currentTrack: null,
  roundPoints: [],
  bonusTitle: [],
  bonusArtist: []
};

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function resetGame() {
  localStorage.removeItem(STORAGE_KEY);
  state = {
    phase: 'setup', gameMode: 'simultaneous', playerCount: 3, players: ['', '', ''], scores: [0,0,0],
    totalRounds: 10, round: 1, turnIndexInRound: 0, guesses: ['', '', ''], currentTrack: null,
    roundPoints: [], bonusTitle: [], bonusArtist: []
  };
  render();
}

document.getElementById('resetCornerBtn').addEventListener('click', () => {
  if (confirm('Spiel wirklich zurücksetzen? Alle Punkte und Einstellungen gehen verloren.')) {
    resetGame();
  }
});

function el(html) {
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

function render() {
  saveState();
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (state.phase === 'setup') app.appendChild(renderSetup());
  else if (state.phase === 'spotify-login') app.appendChild(renderSpotifyLogin());
  else if (state.phase === 'guessing') app.appendChild(renderGuessing());
  else if (state.phase === 'resolving') app.appendChild(renderResolving());
  else if (state.phase === 'trackreveal') app.appendChild(renderTrackReveal());
  else if (state.phase === 'scoring') app.appendChild(renderScoring());
  else if (state.phase === 'gameover') app.appendChild(renderGameOver());
  renderScorebar();
}

/* ---------- SETUP ---------- */
function renderSetup() {
  const wrap = el('<div></div>');
  const card = el('<div class="card"></div>');

  card.appendChild(el('<p class="label">Spielmodus</p>'));
  const modeRow = el('<div class="countrow"></div>');
  const simBtn = el('<button class="' + (state.gameMode === 'simultaneous' ? 'active' : '') + '" style="flex-basis:48%;">Gleichzeitig</button>');
  simBtn.onclick = () => { state.gameMode = 'simultaneous'; render(); };
  const altBtn = el('<button class="' + (state.gameMode === 'alternating' ? 'active' : '') + '" style="flex-basis:48%;">Abwechselnd</button>');
  altBtn.onclick = () => { state.gameMode = 'alternating'; render(); };
  modeRow.appendChild(simBtn);
  modeRow.appendChild(altBtn);
  card.appendChild(modeRow);
  const modeHint = state.gameMode === 'alternating'
    ? 'Reihum: bei jedem Song rät nur eine Person das Jahr, danach ist die nächste Person am nächsten Song dran.'
    : 'Alle Spieler schätzen gleichzeitig das Jahr desselben Songs, wer am nächsten dran ist bekommt die meisten Punkte.';
  card.appendChild(el('<p class="status-text" style="margin-bottom:1rem;">' + modeHint + '</p>'));

  card.appendChild(el('<p class="label">Wie viele Spieler?</p>'));
  const countrow = el('<div class="countrow"></div>');
  for (let n = 2; n <= 6; n++) {
    const btn = el('<button class="' + (state.playerCount === n ? 'active' : '') + '">' + n + '</button>');
    btn.onclick = () => {
      state.playerCount = n;
      const newPlayers = Array.from({length: n}, (_, i) => state.players[i] || '');
      state.players = newPlayers;
      state.scores = Array.from({length: n}, (_, i) => state.scores[i] || 0);
      render();
    };
    countrow.appendChild(btn);
  }
  card.appendChild(countrow);

  card.appendChild(el('<p class="label">Wie viele Runden?</p>'));
  const roundSelect = document.createElement('select');
  for (let r = 5; r <= 25; r++) {
    const opt = document.createElement('option');
    opt.value = r;
    opt.textContent = r + ' Runden';
    if (r === state.totalRounds) opt.selected = true;
    roundSelect.appendChild(opt);
  }
  roundSelect.onchange = (e) => { state.totalRounds = Number(e.target.value); };
  const roundRow = el('<div style="margin-bottom:1rem;"></div>');
  roundRow.appendChild(roundSelect);
  card.appendChild(roundRow);
  if (state.gameMode === 'alternating') {
    card.appendChild(el('<p class="status-text" style="margin-top:-0.5rem;margin-bottom:1rem;">Eine Runde = jeder Spieler ist einmal dran (bei ' + state.playerCount + ' Spielern also ' + state.playerCount + ' Songs pro Runde).</p>'));
  }

  card.appendChild(el('<p class="label">Namen eingeben</p>'));
  state.players.forEach((p, i) => {
    const row = el('<div style="margin-bottom:12px;"></div>');
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Spieler ' + (i+1);
    input.value = p;
    input.oninput = (e) => { state.players[i] = e.target.value; };
    row.appendChild(input);
    card.appendChild(row);
  });
  const err = el('<p class="error">Bitte alle Namen eingeben</p>');
  card.appendChild(err);
  const btn = el('<button style="margin-top:8px;">Weiter zu Spotify</button>');
  btn.onclick = () => {
    if (state.players.some(p => !p.trim())) { err.style.display = 'block'; return; }
    state.guesses = state.players.map(() => '');
    state.round = 1;
    state.turnIndexInRound = 0;
    state.phase = 'spotify-login';
    render();
  };
  card.appendChild(btn);
  wrap.appendChild(card);
  return wrap;
}

/* ---------- SPOTIFY LOGIN (PKCE) ---------- */
function randomString(length = 64) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const values = crypto.getRandomValues(new Uint8Array(length));
  return Array.from(values, x => chars[x % chars.length]).join("");
}
async function sha256(text) {
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
}
function base64UrlEncode(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
}
async function spotifyLogin() {
  if (!CLIENT_ID || CLIENT_ID === "DEINE_SPOTIFY_CLIENT_ID") {
    alert("Bitte zuerst CLIENT_ID im Code eintragen.");
    return;
  }
  const verifier = randomString(64);
  const challenge = base64UrlEncode(await sha256(verifier));
  const authState = randomString(32);
  localStorage.setItem("spotify_code_verifier", verifier);
  localStorage.setItem("spotify_auth_state", authState);
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    scope: SCOPES.join(" "),
    code_challenge_method: "S256",
    code_challenge: challenge,
    state: authState
  });
  location.href = "https://accounts.spotify.com/authorize?" + params.toString();
}
async function exchangeCodeForToken(code) {
  const verifier = localStorage.getItem("spotify_code_verifier");
  if (!verifier) throw new Error("PKCE Code Verifier fehlt.");
  const response = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      client_id: CLIENT_ID, grant_type: "authorization_code", code,
      redirect_uri: REDIRECT_URI, code_verifier: verifier
    })
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error_description || data.error || "Token-Fehler");
  saveTokens(data);
}
function saveTokens(data) {
  localStorage.setItem("spotify_access_token", data.access_token);
  localStorage.setItem("spotify_access_token_expires_at", String(Date.now() + data.expires_in * 1000));
  if (data.refresh_token) localStorage.setItem("spotify_refresh_token", data.refresh_token);
}
async function refreshAccessToken() {
  const refreshToken = localStorage.getItem("spotify_refresh_token");
  if (!refreshToken) throw new Error("Kein Refresh Token vorhanden.");
  const response = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: "refresh_token", refresh_token: refreshToken })
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error_description || data.error || "Refresh fehlgeschlagen");
  saveTokens(data);
  return data.access_token;
}
async function getAccessToken() {
  const token = localStorage.getItem("spotify_access_token");
  const expiresAt = Number(localStorage.getItem("spotify_access_token_expires_at")) || 0;
  if (token && Date.now() < expiresAt - 60000) return token;
  return refreshAccessToken();
}
function isSpotifyConnected() {
  return !!(localStorage.getItem("spotify_access_token") || localStorage.getItem("spotify_refresh_token"));
}
function spotifyLogout() {
  ["spotify_access_token","spotify_access_token_expires_at","spotify_refresh_token","spotify_code_verifier","spotify_auth_state"]
    .forEach(k => localStorage.removeItem(k));
}

function renderSpotifyLogin() {
  const wrap = el('<div></div>');
  const card = el('<div class="card"></div>');
  card.appendChild(el('<p class="title">Mit Spotify verbinden</p>'));
  card.appendChild(el('<p class="status-text" style="margin-bottom:1rem;">Nötig, um Titel, Interpret und Jahr des laufenden Songs automatisch zu erkennen. Die Wiedergabe läuft weiter ganz normal über die Spotify-App.</p>'));
  const btn = el('<button class="spotify">Mit Spotify verbinden</button>');
  btn.onclick = spotifyLogin;
  card.appendChild(btn);
  const err = el('<p class="error" id="spotifyErr"></p>');
  card.appendChild(err);
  wrap.appendChild(card);
  return wrap;
}

/* ---------- GUESSING ---------- */
function renderGuessing() {
  if (state.gameMode === 'alternating') return renderGuessingAlternating();
  return renderGuessingSimultaneous();
}

function renderGuessingSimultaneous() {
  const wrap = el('<div></div>');
  wrap.appendChild(el('<p class="label">Runde ' + state.round + ' von ' + state.totalRounds + '</p>'));

  wrap.appendChild(renderPlaybackControls());

  const card = el('<div class="card"></div>');
  card.appendChild(el('<p class="title">Geschätzte Jahre eingeben</p>'));
  const err = el('<p class="error">Bitte für alle Spieler ein Jahr eingeben</p>');
  state.players.forEach((p, i) => {
    const row = el('<div class="row"></div>');
    row.appendChild(el('<span class="pname">' + p + '</span>'));
    const input = document.createElement('input');
    input.type = 'number';
    input.inputMode = 'numeric';
    input.placeholder = 'Jahr';
    input.value = state.guesses[i] || '';
    input.oninput = (e) => { state.guesses[i] = e.target.value; err.style.display='none'; };
    row.appendChild(input);
    card.appendChild(row);
  });
  card.appendChild(err);
  const btn = el('<button style="margin-top:4px;">Auflösen</button>');
  btn.onclick = () => {
    if (state.guesses.some(g => g === '' || isNaN(Number(g)))) { err.style.display = 'block'; return; }
    state.phase = 'resolving';
    render();
    fetchCurrentTrack();
  };
  card.appendChild(btn);
  wrap.appendChild(card);
  return wrap;
}

function renderGuessingAlternating() {
  const wrap = el('<div></div>');
  const currentPlayer = state.players[state.turnIndexInRound];
  wrap.appendChild(el('<p class="label">Runde ' + state.round + ' von ' + state.totalRounds + ' &middot; Song ' + (state.turnIndexInRound + 1) + '/' + state.playerCount + '</p>'));

  wrap.appendChild(renderPlaybackControls());

  const card = el('<div class="card"></div>');
  card.appendChild(el('<p class="title">' + escapeHtml(currentPlayer) + ' ist dran</p>'));
  const err = el('<p class="error">Bitte ein Jahr eingeben</p>');
  const row = el('<div class="row"></div>');
  row.appendChild(el('<span class="pname">' + escapeHtml(currentPlayer) + '</span>'));
  const input = document.createElement('input');
  input.type = 'number';
  input.inputMode = 'numeric';
  input.placeholder = 'Jahr';
  input.value = state.guesses[state.turnIndexInRound] || '';
  input.oninput = (e) => { state.guesses[state.turnIndexInRound] = e.target.value; err.style.display='none'; };
  row.appendChild(input);
  card.appendChild(row);
  card.appendChild(err);
  const btn = el('<button style="margin-top:4px;">Auflösen</button>');
  btn.onclick = () => {
    const g = state.guesses[state.turnIndexInRound];
    if (g === '' || g === undefined || isNaN(Number(g))) { err.style.display = 'block'; return; }
    state.phase = 'resolving';
    render();
    fetchCurrentTrack();
  };
  card.appendChild(btn);
  wrap.appendChild(card);
  return wrap;
}

/* ---------- RESOLVING (loading) ---------- */
/* ---------- PLAYBACK CONTROLS (Play/Pause, Vor, Zurück) ---------- */
function renderPlaybackControls() {
  const card = el('<div class="card"></div>');
  const controls = el('<div class="playback-controls"></div>');

  const prevBtn = el('<button class="playback-btn">⏮</button>');
  prevBtn.onclick = () => spotifySkip('previous');
  controls.appendChild(prevBtn);

  const playPauseBtn = el('<button class="playback-btn main">⏯</button>');
  playPauseBtn.onclick = spotifyTogglePlayPause;
  controls.appendChild(playPauseBtn);

  const nextBtn = el('<button class="playback-btn">⏭</button>');
  nextBtn.onclick = () => spotifySkip('next');
  controls.appendChild(nextBtn);

  card.appendChild(controls);
  card.appendChild(el('<p class="playback-status" id="playbackStatus"></p>'));
  const reconnectBtn = el('<button class="secondary small" style="width:100%;margin-top:8px;">Spotify neu verbinden</button>');
  reconnectBtn.onclick = () => {
    if (confirm('Spotify-Verbindung erneuern? Nötig z.B. wenn Play/Pause "kein Premium" meldet, obwohl du Premium hast (dann fehlt nur die neuere Berechtigung im alten Token). Spielstand bleibt erhalten.')) {
      spotifyLogout();
      state.phase = 'spotify-login';
      render();
    }
  };
  card.appendChild(reconnectBtn);
  return card;
}

function setPlaybackStatus(text) {
  const el2 = document.getElementById('playbackStatus');
  if (el2) el2.textContent = text;
}

async function spotifyApiCall(path, method) {
  const token = await getAccessToken();
  const response = await fetch("https://api.spotify.com/v1" + path, {
    method,
    headers: { Authorization: `Bearer ${token}` }
  });
  if (response.status === 401) {
    await refreshAccessToken();
    return spotifyApiCall(path, method);
  }
  if (response.status === 404) {
    throw new Error("Kein aktives Gerät. Bitte Spotify auf dem Handy öffnen und einen Song starten.");
  }
  if (response.status === 403) {
    let detail = "";
    try {
      const errBody = await response.json();
      detail = errBody?.error?.reason || errBody?.error?.message || "";
    } catch (e) {}
    throw new Error("Nicht erlaubt" + (detail ? " (" + detail + ")" : " (403, Grund unbekannt)"));
  }
  if (!response.ok && response.status !== 204) {
    throw new Error("Spotify-Fehler " + response.status);
  }
  return response;
}

// Lokal gemerkter Wiedergabestatus, um die Race Condition mit Spotifys
// GET /me/player zu umgehen (der Status dort hinkt kurz nach einer Aktion
// hinterher und führte sonst zu "UNKNOWN"-Fehlern beim Pausieren).
let assumedIsPlaying = null;

async function spotifyTogglePlayPause() {
  setPlaybackStatus("…");
  try {
    let isPlaying;
    if (assumedIsPlaying === null) {
      const token = await getAccessToken();
      const stateResp = await fetch("https://api.spotify.com/v1/me/player", {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (stateResp.status === 204) {
        throw new Error("Kein aktives Gerät. Bitte Spotify auf dem Handy öffnen und einen Song starten.");
      }
      const playerData = await stateResp.json();
      isPlaying = !!playerData.is_playing;
    } else {
      isPlaying = assumedIsPlaying;
    }
    await spotifyApiCall(isPlaying ? "/me/player/pause" : "/me/player/play", "PUT");
    assumedIsPlaying = !isPlaying;
    setPlaybackStatus(isPlaying ? "Pausiert" : "Läuft");
  } catch (e) {
    assumedIsPlaying = null;
    setPlaybackStatus(e.message);
  }
}

async function spotifySkip(direction) {
  setPlaybackStatus("…");
  try {
    await spotifyApiCall("/me/player/" + direction, "POST");
    assumedIsPlaying = true;
    setPlaybackStatus(direction === "next" ? "Nächster Song gestartet" : "Vorheriger Song gestartet");
  } catch (e) {
    assumedIsPlaying = null;
    setPlaybackStatus(e.message);
  }
}

function renderResolving() {
  const wrap = el('<div></div>');
  const card = el('<div class="card" style="text-align:center;"></div>');
  card.appendChild(el('<p class="title">Track wird abgefragt …</p>'));
  card.appendChild(el('<p class="status-text" id="resolveStatus">Einen Moment</p>'));
  wrap.appendChild(card);
  return wrap;
}

async function fetchCurrentTrack() {
  const statusEl = () => document.getElementById('resolveStatus');
  try {
    const token = await getAccessToken();
    const response = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (response.status === 204) {
      if (statusEl()) statusEl().textContent = "Aktuell läuft kein Track auf Spotify. Song starten und nochmal versuchen.";
      showRetryButton();
      return;
    }
    if (response.status === 401) {
      await refreshAccessToken();
      return fetchCurrentTrack();
    }
    if (!response.ok) throw new Error("Spotify API Fehler " + response.status);
    const data = await response.json();
    if (!data.item || data.currently_playing_type !== "track") {
      if (statusEl()) statusEl().textContent = "Kein Musik-Track erkannt.";
      showRetryButton();
      return;
    }
    const track = data.item;
    const releaseDate = track.album?.release_date || "";
    const year = releaseDate ? Number(releaseDate.slice(0,4)) : null;
    state.currentTrack = {
      title: track.name,
      artist: track.artists?.map(a => a.name).join(", ") || "Unbekannt",
      year: year,
      cover: track.album?.images?.[0]?.url || ""
    };
    if (state.gameMode === 'alternating') {
      calcAlternatingPoints();
    } else {
      calcRoundPoints();
    }
    state.bonusTitle = state.players.map(() => false);
    state.bonusArtist = state.players.map(() => false);
    state.phase = 'trackreveal';
    render();
  } catch (error) {
    console.error(error);
    if (statusEl()) statusEl().textContent = "Fehler: " + error.message;
    showRetryButton();
  }
}

function showRetryButton() {
  const card = document.querySelector('#app .card');
  if (!card || document.getElementById('retryBtn')) return;
  const retry = el('<button id="retryBtn" style="margin-top:12px;">Erneut versuchen</button>');
  retry.onclick = () => { render(); fetchCurrentTrack(); };
  card.appendChild(retry);
  const back = el('<button id="backBtn" class="secondary" style="margin-top:8px;">Zurück zur Jahreseingabe</button>');
  back.onclick = () => { state.phase = 'guessing'; render(); };
  card.appendChild(back);
}

/* ---------- TRACK REVEAL ---------- */
function renderTrackReveal() {
  const wrap = el('<div></div>');
  const label = state.gameMode === 'alternating'
    ? 'Runde ' + state.round + ' von ' + state.totalRounds + ' &middot; ' + escapeHtml(state.players[state.turnIndexInRound]) + ' war dran'
    : 'Runde ' + state.round + ' von ' + state.totalRounds;
  wrap.appendChild(el('<p class="label">' + label + '</p>'));
  const card = el('<div class="card track-panel"></div>');
  const t = state.currentTrack;
  if (t.cover) card.appendChild(el('<img class="track-cover" src="' + t.cover + '" alt="Cover">'));
  card.appendChild(el('<p class="track-title">' + escapeHtml(t.title) + '</p>'));
  card.appendChild(el('<p class="track-artist">' + escapeHtml(t.artist) + '</p>'));
  card.appendChild(el('<p class="track-year">' + (t.year || '????') + '</p>'));
  wrap.appendChild(card);
  const btn = el('<button>Weiter zu Punkten</button>');
  btn.onclick = () => { state.phase = 'scoring'; render(); };
  wrap.appendChild(btn);
  return wrap;
}

/* ---------- SCORING ---------- */
function calcRoundPoints() {
  const correct = state.currentTrack ? state.currentTrack.year : null;
  if (correct === null) { state.roundPoints = state.players.map(() => 0); return; }
  const diffs = state.guesses.map(g => Math.abs(Number(g) - correct));
  const sorted = [...diffs].sort((a,b) => a-b);
  const best = sorted[0];
  const second = sorted.find(d => d > best);
  state.roundPoints = diffs.map(d => {
    if (d === best) return 2;
    if (second !== undefined && d === second) return 1;
    return 0;
  });
}

// Abwechselnd-Modus: nur eine Person rät pro Song, kein Vergleich moeglich.
// Annahme: exaktes Jahr = 2 Punkte, Abweichung bis 2 Jahre = 1 Punkt, sonst 0.
// Abwechselnd-Modus: nur eine Person rät pro Song, kein Vergleich moeglich.
// exaktes Jahr = 3 Punkte, Abweichung bis 3 Jahre = 1 Punkt, sonst 0.
function calcAlternatingPoints() {
  const correct = state.currentTrack ? state.currentTrack.year : null;
  state.roundPoints = state.players.map(() => 0);
  if (correct === null) return;
  const guess = Number(state.guesses[state.turnIndexInRound]);
  const diff = Math.abs(guess - correct);
  let points = 0;
  if (diff === 0) points = 3;
  else if (diff <= 3) points = 1;
  state.roundPoints[state.turnIndexInRound] = points;
}

function renderScoring() {
  if (state.gameMode === 'alternating') return renderScoringAlternating();
  return renderScoringSimultaneous();
}

function renderScoringSimultaneous() {
  const wrap = el('<div></div>');
  const t = state.currentTrack;
  wrap.appendChild(el('<p class="label">Runde ' + state.round + ' von ' + state.totalRounds + ' &middot; ' + escapeHtml(t.title) + ' &ndash; ' + escapeHtml(t.artist) + ' (' + (t.year || '????') + ')</p>'));
  const card = el('<div class="card"></div>');
  card.appendChild(el('<p class="title">Rundenpunkte</p>'));
  state.players.forEach((p, i) => {
    const row = el('<div class="reveal-row"></div>');
    const left = el('<div class="reveal-left"></div>');
    left.appendChild(el('<span class="pname">' + escapeHtml(p) + '</span>'));
    left.appendChild(el('<span class="guess">Geschätzt: ' + state.guesses[i] + '</span>'));
    row.appendChild(left);

    const right = el('<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;"></div>');
    const totalBonus = (state.bonusTitle[i] ? 1 : 0) + (state.bonusArtist[i] ? 1 : 0);
    const pointsSpan = el('<span class="points">+' + (state.roundPoints[i] + totalBonus) + '</span>');
    right.appendChild(pointsSpan);

    const bonusWrap = el('<div class="bonusbtns"></div>');
    const titleBtn = el('<button class="small' + (state.bonusTitle[i] ? ' active' : '') + '">Titel ' + (state.bonusTitle[i] ? '✓' : '+1') + '</button>');
    titleBtn.onclick = () => { state.bonusTitle[i] = !state.bonusTitle[i]; render(); };
    const artistBtn = el('<button class="small' + (state.bonusArtist[i] ? ' active' : '') + '">Interpret ' + (state.bonusArtist[i] ? '✓' : '+1') + '</button>');
    artistBtn.onclick = () => { state.bonusArtist[i] = !state.bonusArtist[i]; render(); };
    bonusWrap.appendChild(titleBtn);
    bonusWrap.appendChild(artistBtn);
    right.appendChild(bonusWrap);

    row.appendChild(right);
    card.appendChild(row);
  });
  wrap.appendChild(card);

  const isLastRound = state.round >= state.totalRounds;
  const nextBtn = el('<button>' + (isLastRound ? 'Spiel beenden' : 'Nächste Runde') + '</button>');
  nextBtn.onclick = () => {
    state.players.forEach((p, i) => {
      state.scores[i] += state.roundPoints[i] + (state.bonusTitle[i] ? 1 : 0) + (state.bonusArtist[i] ? 1 : 0);
    });
    if (isLastRound) {
      state.phase = 'gameover';
      render();
      return;
    }
    state.round += 1;
    state.guesses = state.players.map(() => '');
    state.currentTrack = null;
    state.phase = 'guessing';
    render();
  };
  wrap.appendChild(nextBtn);
  return wrap;
}

function renderScoringAlternating() {
  const wrap = el('<div></div>');
  const t = state.currentTrack;
  const i = state.turnIndexInRound;
  const currentPlayer = state.players[i];
  wrap.appendChild(el('<p class="label">Runde ' + state.round + ' von ' + state.totalRounds + ' &middot; ' + escapeHtml(t.title) + ' &ndash; ' + escapeHtml(t.artist) + ' (' + (t.year || '????') + ')</p>'));
  const card = el('<div class="card"></div>');
  card.appendChild(el('<p class="title">Punkte für ' + escapeHtml(currentPlayer) + '</p>'));

  const row = el('<div class="reveal-row"></div>');
  const left = el('<div class="reveal-left"></div>');
  left.appendChild(el('<span class="pname">' + escapeHtml(currentPlayer) + '</span>'));
  left.appendChild(el('<span class="guess">Geschätzt: ' + state.guesses[i] + '</span>'));
  row.appendChild(left);

  const right = el('<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;"></div>');
  const totalBonus = (state.bonusTitle[i] ? 1 : 0) + (state.bonusArtist[i] ? 1 : 0);
  const pointsSpan = el('<span class="points">+' + (state.roundPoints[i] + totalBonus) + '</span>');
  right.appendChild(pointsSpan);

  const bonusWrap = el('<div class="bonusbtns"></div>');
  const titleBtn = el('<button class="small' + (state.bonusTitle[i] ? ' active' : '') + '">Titel ' + (state.bonusTitle[i] ? '✓' : '+1') + '</button>');
  titleBtn.onclick = () => { state.bonusTitle[i] = !state.bonusTitle[i]; render(); };
  const artistBtn = el('<button class="small' + (state.bonusArtist[i] ? ' active' : '') + '">Interpret ' + (state.bonusArtist[i] ? '✓' : '+1') + '</button>');
  artistBtn.onclick = () => { state.bonusArtist[i] = !state.bonusArtist[i]; render(); };
  bonusWrap.appendChild(titleBtn);
  bonusWrap.appendChild(artistBtn);
  right.appendChild(bonusWrap);

  row.appendChild(right);
  card.appendChild(row);
  wrap.appendChild(card);

  const isLastTurnOfRound = state.turnIndexInRound >= state.playerCount - 1;
  const isLastTurnOfGame = isLastTurnOfRound && state.round >= state.totalRounds;
  const nextBtn = el('<button>' + (isLastTurnOfGame ? 'Spiel beenden' : 'Weiter') + '</button>');
  nextBtn.onclick = () => {
    state.scores[i] += state.roundPoints[i] + (state.bonusTitle[i] ? 1 : 0) + (state.bonusArtist[i] ? 1 : 0);
    if (isLastTurnOfGame) {
      state.phase = 'gameover';
      render();
      return;
    }
    if (isLastTurnOfRound) {
      state.turnIndexInRound = 0;
      state.round += 1;
      state.guesses = state.players.map(() => '');
    } else {
      state.turnIndexInRound += 1;
    }
    state.currentTrack = null;
    state.phase = 'guessing';
    render();
  };
  wrap.appendChild(nextBtn);
  return wrap;
}

/* ---------- GAME OVER ---------- */
function renderGameOver() {
  const wrap = el('<div></div>');
  const card = el('<div class="card"></div>');
  card.appendChild(el('<p class="trophy">🏆</p>'));
  card.appendChild(el('<p class="title" style="text-align:center;">Endstand nach ' + state.totalRounds + ' Runden</p>'));

  const ranked = state.players.map((p, i) => ({ name: p, score: state.scores[i] }))
    .sort((a, b) => b.score - a.score);
  const topScore = ranked.length ? ranked[0].score : 0;

  ranked.forEach((r, idx) => {
    const isWinner = r.score === topScore;
    const row = el('<div class="final-row' + (isWinner ? ' winner' : '') + '"></div>');
    const left = el('<div style="display:flex;align-items:center;"></div>');
    left.appendChild(el('<span class="fplace">#' + (idx + 1) + '</span>'));
    left.appendChild(el('<span class="fname">' + escapeHtml(r.name) + (isWinner ? ' 🏆' : '') + '</span>'));
    row.appendChild(left);
    row.appendChild(el('<span class="fscore">' + r.score + '</span>'));
    card.appendChild(row);
  });
  wrap.appendChild(card);

  const newGameBtn = el('<button>Neues Spiel</button>');
  newGameBtn.onclick = () => { resetGame(); };
  wrap.appendChild(newGameBtn);
  return wrap;
}

/* ---------- PERSISTENT SCOREBAR ---------- */
function renderScorebar() {
  const bar = document.getElementById('scorebar');
  const inner = document.getElementById('scorebarInner');
  const showBar = ['guessing','resolving','trackreveal','scoring'].includes(state.phase);
  bar.classList.toggle('visible', showBar);
  if (!showBar) return;
  inner.innerHTML = '';
  const maxScore = Math.max(...state.scores);
  state.players.forEach((p, i) => {
    const leading = state.scores[i] === maxScore && maxScore > 0;
    const cell = el('<div class="scorebar-cell' + (leading ? ' leading' : '') + '"></div>');
    cell.appendChild(el('<p class="sname">' + escapeHtml(p) + '</p>'));
    cell.appendChild(el('<p class="sval">' + state.scores[i] + '</p>'));
    inner.appendChild(cell);
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

/* ---------- INIT (handles Spotify OAuth redirect) ---------- */
async function init() {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const returnedState = params.get("state");
  const error = params.get("error");

  if (error) {
    history.replaceState({}, "", REDIRECT_URI);
    render();
    if (state.phase === 'spotify-login') {
      const err = document.getElementById('spotifyErr');
      if (err) { err.style.display = 'block'; err.textContent = "Spotify-Anmeldung abgebrochen: " + error; }
    }
    return;
  }

  if (code) {
    try {
      const expectedState = localStorage.getItem("spotify_auth_state");
      if (!returnedState || returnedState !== expectedState) throw new Error("OAuth state stimmt nicht überein.");
      await exchangeCodeForToken(code);
      localStorage.removeItem("spotify_code_verifier");
      localStorage.removeItem("spotify_auth_state");
      history.replaceState({}, "", REDIRECT_URI);
      if (state.phase === 'spotify-login') state.phase = 'guessing';
      render();
      return;
    } catch (e) {
      console.error(e);
      history.replaceState({}, "", REDIRECT_URI);
      render();
      const err = document.getElementById('spotifyErr');
      if (err) { err.style.display = 'block'; err.textContent = "Login-Fehler: " + e.message; }
      return;
    }
  }

  if (state.phase === 'spotify-login' && isSpotifyConnected()) {
    state.phase = 'guessing';
  }
  render();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

init();
